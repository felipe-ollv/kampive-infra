name: kampive

services:
  postgres:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_DB: kampive
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Set POSTGRES_ADMIN_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d kampive"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - backend
    restart: unless-stopped

  api:
    build:
      context: ../kampive-api
      dockerfile: Dockerfile
    image: kampive-api:0.0.1-local
    volumes:
      - campsite_uploads:/app/uploads
    environment:
      SPRING_PROFILES_ACTIVE: local
      EMAIL_SENDER_ADDRESS: ${EMAIL_SENDER_ADDRESS:-contact@kampive.app}
      EMAIL_SENDER_NAME: ${EMAIL_SENDER_NAME:-Kampive}
      BREVO_API_KEY: ${BREVO_API_KEY:-}
      RECOVERY_RESET_URL: ${RECOVERY_RESET_URL:-https://localhost:8443/reset-password}
      EMAIL_VERIFICATION_URL: ${EMAIL_VERIFICATION_URL:-https://localhost:8443/verify-email}
      EMAIL_LOGO_URL: ${EMAIL_LOGO_URL:-https://localhost:8443/brand/icon.png}
      EMAIL_SUPPORT_URL: ${EMAIL_SUPPORT_URL:-https://localhost:8443/support.html}
      RECOVERY_TOKEN_KEY: ${RECOVERY_TOKEN_KEY:-}
      SERVER_SERVLET_SESSION_COOKIE_SECURE: "true"
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      DB_URL: jdbc:postgresql://postgres:5432/kampive
      DB_USERNAME: kampive_app
      DB_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD in .env}
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "8080"
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=256m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  gateway:
    build: ./gateway
    image: kampive-gateway:0.0.1-local
    depends_on:
      api:
        condition: service_started
    ports:
      - "127.0.0.1:8443:8443"
    volumes:
      - ../kampive-app/dist:/srv/app:ro
      - ../kampive-app/assets/icon.png:/srv/brand/icon.png:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - backend
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

volumes:
  campsite_uploads:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  backend:
